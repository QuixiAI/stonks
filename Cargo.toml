[package]
name = "stonks"
version = "0.1.0"
edition = "2024"

[dependencies]
# Every aisdk provider is enabled so the provider can be chosen in config.
aisdk = { version = "0.6.4", features = [
    "302ai",
    "abacus",
    "aihubmix",
    "alibaba",
    "alibaba-cn",
    "amazon-bedrock",
    "anthropic",
    "bailing",
    "baseten",
    "berget",
    "chutes",
    "cloudflare-ai-gateway",
    "cloudflare-workers-ai",
    "cortecs",
    "deepseek",
    "fastrouter",
    "fireworks-ai",
    "firmware",
    "friendli",
    "github-copilot",
    "github-models",
    "google",
    "groq",
    "helicone",
    "huggingface",
    "iflowcn",
    "inception",
    "inference",
    "io-net",
    "jiekou",
    "kuae-cloud-coding-plan",
    "llama",
    "lmstudio",
    "lucidquery",
    "mistral",
    "moark",
    "modelscope",
    "moonshotai",
    "moonshotai-cn",
    "morph",
    "nano-gpt",
    "nebius",
    "nova",
    "novita-ai",
    "nvidia",
    "ollama-cloud",
    "openai",
    "openaicompatible",
    "opencode",
    "openrouter",
    "ovhcloud",
    "poe",
    "requesty",
    "scaleway",
    "siliconflow",
    "siliconflow-cn",
    "stackit",
    "stepfun",
    "submodel",
    "synthetic",
    "togetherai",
    "upstage",
    "vercel",
    "vultr",
    "wandb",
    "xai",
    "xiaomi",
    "zai",
    "zai-coding-plan",
    "zenmux",
    "zhipuai",
    "zhipuai-coding-plan",
] }
anyhow = "1.0.104"
async-trait = "0.1.92"
base64 = "0.23.1"
clap = { version = "4.6.7", features = ["derive", "env"] }
directories = "6.0.0"
futures = "0.3.34"
inquire = "0.9.4"
open = "5.4.5"
rand = "0.10.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serde_yaml_ng = "0.10.0"
sha2 = "0.11.1"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "io-util", "time"] }
